<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafting & Co. | Contact</title>
    <meta name="author" content="Josh Montgomery">
    <meta name="description"
      content="How to contact Rafting & Co for questions, concerns, and booking">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="address">
            <h2>Rafting & Co.</h2>
            <p>123 Main River st</p>
            <p>Kolob, California</p>
            <p>(555) 555-5555</p>
            <p>raftingandco@rafting.com</p>
            </p>
        </section>
        <section class="form">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d39412.632670575156!2d-109.25280661895287!3d38.88760151962964!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1781302233045!5m2!1sen!2sus"
                  width="350" height="350" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form class="contact">
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Type here" />
                <label for="email">email</label>
                <input id="email" type="email" placeholder="Type here" />

                <label for="purpose">Message Purpose</label>
                <div id="purpose">
                    <input id="inquiry" type="radio" name="purposeradio" />
                    <label for="inquiry">General Inquiry</label><br>

                    <input id="question" type="radio" name="purposeradio" />
                    <label for="question">Reservation Question</label><br>

                    <input id="suggestion" type="radio" name="purposeradio" />
                    <label for="suggestion">Website Suggestion</label><br>
                </div>
                <div class="twowide flexColumn">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Type here"> </textarea>
                </div>
                <div class="twowide flexRow">
                    <input id="suggestion" type="checkbox" /><label for="suggestion"
                      name="purpose">Subscribe to monthly newsletter</label><br>
                </div>
                <div class="twowide flexColumn">
                    <input id="submit" type="submit" value="Get in touch!" />
                </div>
            </form>
        </section>
        <section class="employee">
            <h1>We Are Here To Serve You</h1>
            <img src="images/ceo.jpg" alt="CEO">
            <img src="images/tourguide.jpg" alt="Tour Guide">
            <img src="images/scheduler.jpg" alt="Secretary">
            <p>CEO</p>
            <p>Tour Guide</p>
            <p>Secretary</p>
        </section>
    </main>
    <footer>
        <p>
            &copy; 2026 Raft & Co., Josh Montgomery
        </p>
        <nav class="socialmedia">
            <a href="instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a><a href="facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a><a href="youtube.com">
                <img src="images/youtube.png" alt="Youtube">
            </a>
        </nav>

    </footer>
</body>

</html>
