<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafting & Co. | About Us</title>
    <meta name="author" content="Josh Montgomery">
    <meta name="description"
      content="A page about a rafting company. We provide amazing rafting tours for a low cost">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/home_hero.jpg" alt="Hero Image">
            <h1>Adventure is out there</h1>
        </div>
        <section class="more">
            <figure>
                <img src="images/adventure1.jpg" alt="Adventure One">
                <figcaption>Beautiful Scenery</figcaption>
            </figure>
            <figure>
                <img src="images/adventure2.jpg" alt="Adventure Image Two">
                <figcaption>Thrilling Rapids</figcaption>
            </figure>
            <figure>
                <img src="images/adventure3.jpg" alt="Adventure Image Three">
                <figcaption>Inspiring Tours</figcaption>
            </figure>
        </section>
        <section class="signup">
            <div class="callToAction">
                <p>Come find fun, adventure, and memories for a lifetime</p>
                <img src="images/adventure4.jpg" alt="Book A Trip Img">
                <a href="trips.html"> Book a trip</a>
            </div>
            <div>
                <h2>Newsletter Signup</h2>
                <form class="contact">
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Type here" name="contact" />
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Type here" name="contact" />

                    <div class="twowide flexColumn">
                        <input id="submit" type="submit" value="Sign Up" name="contact" />
                    </div>
                </form>
            </div>
        </section>

    </main>
    <footer>
        <p>
            &copy; 2026 Raft & Co., Josh Montgomery
        </p>
        <nav class="socialmedia">
            <a href="instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a><a href="facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a><a href="youtube.com">
                <img src="images/youtube.png" alt="Youtube">
            </a>
        </nav>

    </footer>
</body>

</html>
